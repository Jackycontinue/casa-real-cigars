<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout — Casa Real Cigars</title>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d0d;--card:#1a1a1a;--gold:#c9a84c;--gold-dim:#a08536;--text:#e8e0d0;--muted:#8a8272;--border:#2a2520;--input-bg:#141414}
body{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem}
.container{max-width:580px;margin:0 auto}
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);text-decoration:none;font-size:.85rem;margin-bottom:2rem;transition:color .3s}
.back-link:hover{color:var(--gold)}
h1{font-size:1.8rem;font-weight:300;letter-spacing:3px;text-transform:uppercase;margin-bottom:.3rem;color:var(--text)}
.divider{width:60px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:1rem 0 2rem}
.order-summary{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:2rem}
.order-summary h2{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:1rem}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--border)}
.summary-row:last-child{border-bottom:none}
.summary-label{color:var(--muted);font-size:.85rem}
.summary-value{font-weight:600;font-size:.95rem}
.summary-value.price{color:var(--gold);font-size:1.2rem}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:1rem;margin-top:.5rem}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;letter-spacing:.5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:.7rem 1rem;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.9rem;transition:border-color .3s;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:var(--gold)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:1rem}
.form-row .form-group{flex:1}
.submit-btn{width:100%;padding:.9rem;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:.95rem;border:none;border-radius:4px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .3s;margin-top:1rem}
.submit-btn:hover{background:#d4a843;transform:translateY(-1px);box-shadow:0 4px 20px rgba(201,168,76,.3)}
.notice{text-align:center;color:var(--muted);font-size:.78rem;margin-top:2rem;line-height:1.6}
.fade-up{opacity:0;transform:translateY(20px);animation:fadeUp .8s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="container">
  <a class="back-link fade-up" href="javascript:history.back()">← Back</a>
  <h1 class="fade-up">Checkout</h1>
  <div class="divider"></div>

  <div class="order-summary fade-up" style="animation-delay:.1s">
    <h2>Order Summary</h2>
    <div class="summary-row">
      <span class="summary-label">Brand</span>
      <span class="summary-value" id="s-brand">—</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Product</span>
      <span class="summary-value" id="s-name">—</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Origin</span>
      <span class="summary-value" id="s-origin">—</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Price (Box / 10 sticks)</span>
      <span class="summary-value price" id="s-price">—</span>
    </div>
  </div>

  <div class="fade-up" style="animation-delay:.2s">
    <p class="section-title">Contact Information</p>
    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" placeholder="Phone number">
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Email address">
    </div>
  </div>

  <div class="fade-up" style="animation-delay:.3s">
    <p class="section-title">Shipping Address</p>
    <div class="form-group">
      <label>Address</label>
      <input type="text" placeholder="Street address">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>City</label>
        <input type="text" placeholder="City">
      </div>
      <div class="form-group">
        <label>Province / State</label>
        <input type="text" placeholder="Province">
      </div>
    </div>
    <div class="form-group">
      <label>Postal Code</label>
      <input type="text" placeholder="Postal code">
    </div>
  </div>

  <div class="fade-up" style="animation-delay:.4s">
    <p class="section-title">Additional Notes</p>
    <div class="form-group">
      <textarea placeholder="Special requests or notes (optional)"></textarea>
    </div>
  </div>

  <button class="submit-btn fade-up" style="animation-delay:.5s" onclick="handleSubmit(event)">Submit Order</button>
  <p class="notice fade-up" style="animation-delay:.6s">Payment integration coming soon.<br>Submit your order and we will contact you to complete payment.</p>
</div>

<script>
var params=new URLSearchParams(window.location.search);
document.getElementById('s-brand').textContent=params.get('brand')||'—';
document.getElementById('s-name').textContent=params.get('name')||'—';
document.getElementById('s-origin').textContent=params.get('origin')||'—';
document.getElementById('s-price').textContent=params.get('price')||'—';
document.title=(params.get('brand')||'Checkout')+' — Casa Real Cigars';

function handleSubmit(e){
  e.preventDefault();
  alert('Order submitted! We will contact you shortly to arrange payment. Thank you for choosing Casa Real Cigars.');
  window.location.href='index.html';
}
</script>
</body>
</html>
